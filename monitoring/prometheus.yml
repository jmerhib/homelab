global:
  scrape_interval: 15s
  evaluation_interval: 15s

alerting:
  alertmanagers:
    - static_configs:
        - targets:
        # - alertmanager:9093

rule_files:
# - "first_rules.yml"

# Scraping configuration
scrape_configs:
  - job_name: "prometheus"
    static_configs:
      - targets: ["localhost:9090"]
        labels:
          app: "prometheus"
    scrape_native_histograms: true

  - job_name: "node_exporter"
    static_configs:
      - targets: ["host.docker.internal:9100"]
