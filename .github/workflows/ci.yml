name: ci
on:
  push:
  pull_request:
  schedule:
    - cron: "0 12 * * 1"   # weekly: new CVEs land without any commit

permissions:
  contents: read

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: yamllint
        run: pipx run yamllint .
      - name: compose config
        run: cp .env.example .env && docker compose config -q

  secrets:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@v3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  images:
    runs-on: ubuntu-latest
    outputs:
      list: ${{ steps.l.outputs.list }}
    steps:
      - uses: actions/checkout@v4
      - id: l
        run: |
          cp .env.example .env
          echo "list=$(docker compose config --images | jq -R . | jq -sc .)" >> "$GITHUB_OUTPUT"

  trivy:
    needs: images
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write   # required due to the fact that it uploads to the Security tab
    strategy:
      fail-fast: false
      matrix:
        image: ${{ fromJSON(needs.images.outputs.list) }}
    steps:
      - uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: ${{ matrix.image }}
          format: sarif
          output: trivy.sarif
          severity: CRITICAL
          ignore-unfixed: true
          exit-code: "0"   # shortcut: report-only, upstream :latest/:main images carry CVEs we can't fix here; pin tags and flip to 1 later
      - uses: github/codeql-action/upload-sarif@v4
        if: always()
        with:
          sarif_file: trivy.sarif
          category: trivy-${{ matrix.image }}
