# bee01 — Plex + local AI stack
# Location on bee01: ~/stack/compose.yml  (with .env alongside)
# Start:  docker compose up -d      Logs: docker compose logs -f <service>

services:
  plex:
    image: lscr.io/linuxserver/plex:1.43.5.11079-b3b13e506-ls334@sha256:31e4c2de666cd130bc389133b6c63af08912559d992370e52822f8f229185aef
    container_name: plex
    network_mode: host                  # simplest for LAN discovery; UI at http://bee01:32400/web
    environment:
      - PUID=${PUID}
      - PGID=${PGID}
      - TZ=America/New_York
      - VERSION=docker
      - PLEX_CLAIM=${PLEX_CLAIM}        # from https://plex.tv/claim — only needed on first start
    devices:
      - /dev/dri:/dev/dri               # Radeon 780M for hardware transcoding (needs Plex Pass)
    volumes:
      - plex_config:/config
      - /srv/media:/media
    tmpfs:
      - /transcode:size=4g              # in-RAM transcode scratch; set Plex > Settings > Transcoder dir to /transcode
    restart: unless-stopped

  ollama:
    image: ollama/ollama:0.40.18-rocm@sha256:ab28cc8337abd53e03d21a3d160f3fff2e798ff13d0eb6125284622f9074e5ac
    container_name: ollama
    ports:
      - "11434:11434"                   # API for anything else on the LAN
    devices:
      - /dev/kfd:/dev/kfd
      - /dev/dri:/dev/dri
    group_add:
      - "${VIDEO_GID}"
      - "${RENDER_GID}"
    environment:
      - HSA_OVERRIDE_GFX_VERSION=11.0.2  # 780M (gfx1103) isn't on ROCm's official list; try 11.0.0 if this fails
      - OLLAMA_IGPU_ENABLE=1             # Ollama skips integrated GPUs by default; the 780M is the only GPU here
      - OLLAMA_KEEP_ALIVE=30m
      - OLLAMA_CONTEXT_LENGTH=32768      # Claude Code's prompt alone is ~20k tokens; the 4096 default truncates it
      - OLLAMA_FLASH_ATTENTION=1         # needed for the quantized KV cache below
      - OLLAMA_KV_CACHE_TYPE=q8_0        # halves KV-cache memory so qwen3:14b + 32k context fits in the 780M's ~13 GB
    volumes:
      - ollama:/root/.ollama            # models live on the 830G docker disk
    restart: unless-stopped

  open-webui:
    image: ghcr.io/open-webui/open-webui:main@sha256:ff7f7cbb4545aacec2c22d085b2bc406b299c119bd98747421124a1a6c03795f   # no release tag matches this build; digest pins it
    container_name: open-webui
    ports:
      - "3000:8080"                     # chat UI at http://bee01:3000
    environment:
      - OLLAMA_BASE_URL=http://ollama:11434
    volumes:
      - open-webui:/app/backend/data
    depends_on:
      - ollama
    restart: unless-stopped

  prometheus:
    image: prom/prometheus:v3.16.0@sha256:e04987641b57704f408e31f6373ba4138ecf27cb4a165d24aabb6c38fddd0f06
    container_name: prometheus
    ports:
      - "9090:9090"
    volumes:
      - ./monitoring/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus-data:/prometheus
    restart: unless-stopped
    extra_hosts:
      - "host.docker.internal:host-gateway"

  node_exporter:
    image: prom/node-exporter:v1.13.1@sha256:7296504d4ada44b7d7ab4431e27e9f9900d8488f8d55842f4b12ae2704e16dfe
    container_name: node_exporter
    command:
      - "--path.rootfs=/host"
    network_mode: host
    pid: host
    volumes:
      - "/:/host:ro,rslave"
    restart: unless-stopped

  grafana:
    image: grafana/grafana:13.3.2@sha256:81556409ba48b2b922e0adb69a2511337d8ba7578f11962eefa6149a2d815101
    container_name: grafana
    ports:
      - "3001:3000"
    environment:
      - GF_SECURITY_ADMIN_PASSWORD=${GRAFANA_ADMIN_PASSWORD}
    volumes:
      - grafana_data:/var/lib/grafana
      - ./monitoring/grafana/provisioning/datasources:/etc/grafana/provisioning/datasources:ro
      - ./monitoring/grafana/provisioning/dashboards:/etc/grafana/provisioning/dashboards:ro
      - ./monitoring/grafana/dashboards:/var/lib/grafana/dashboards:ro
    restart: unless-stopped

volumes:
  plex_config:
  ollama:
  open-webui:
  prometheus-data:
  grafana_data:
